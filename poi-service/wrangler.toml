# CoffeeMode POI cache service — Cloudflare Worker
# Docs: docs/specs/0001-nextjs-migration.md § "POI cache service"

name = "poi-service"
main = "src/index.ts"
# Pinned deliberately: this date is a runtime contract, so it moves only in a
# reviewed commit — never implicitly, and never "today". 2025-08-01 is the newest
# date whose default-on flag set (Cloudflare "compatibility flags" history) was
# reviewed against this Worker, and it stays well below the workerd build pinned
# in package-lock.json.
#
# Bumped from 2024-01-01 to pick up that window's runtime spec fixes — the ones
# with any surface here are standard URL parsing in fetch() and cross-request
# promise resolution; uppercase HTTP methods, TransformStream backpressure and
# the Cache API changes are no-ops for this Worker (it calls GET/POST/HEAD with
# uppercase literals, uses no streams and no Cache API, and follows short-link
# redirects itself via `redirect: "manual"`).
#
# No `nodejs_compat` flag: src/ imports no Node built-in. Node compatibility only
# becomes default at compatibility_date 2026-08-04 — this date stays below it, so
# the Worker keeps running without Node globals.
compatibility_date = "2025-08-01"

# --- Secrets (never committed) ---
#   POI_SERVICE_TOKEN       shared secret for service-to-service auth
#   GOOGLE_PLACES_API_KEY   Google Places API (New) key
# Set them with:  wrangler secret put <NAME>
# Local dev: put them in .dev.vars (gitignored)

# --- Bindings ---
# These top-level bindings are the local-dev kit (compose `miniflare-poi`), with
# deterministic placeholder ids. Deploying them is refused: `npm run deploy`
# goes through scripts/deploy.mjs, which requires `--env` and rejects the
# placeholder ids, so a bare `wrangler deploy` cannot ship a Worker bound to
# namespaces that do not exist.
#
# To deploy:
# 1. Create the resources for the target environment:
#      wrangler d1 create poi-store-staging   (production: poi-store)
#      wrangler kv namespace create poi-cache-staging   (production: poi-cache)
# 2. Paste the returned ids into a [env.staging] / [env.production] block
#    (spec 0005 §3 names: poi-service-staging / poi-service-prod).
# 3. Apply the D1 schema:
#      wrangler d1 migrations apply poi-store --remote
# 4. Set secrets (never commit these):
#      wrangler secret put POI_SERVICE_TOKEN --env staging
#      wrangler secret put GOOGLE_PLACES_API_KEY --env staging
#
# See docs/agent/pending-user-actions.md §7 and poi-service/README.md.

[[kv_namespaces]]
binding = "POI_KV"
# Local compose (S2): deterministic local ID so `wrangler dev --local` / miniflare-poi
# never rejects the placeholder. Never deployed — see the note above.
id = "22222222-2222-2222-2222-222222222222"

[[d1_databases]]
binding = "POI_DB"
database_name = "poi-store"
# Local compose (S2): deterministic local ID for `wrangler d1 migrations apply --local`
# and miniflare-poi. Never deployed — see the note above.
database_id = "11111111-1111-1111-1111-111111111111"

# --- Routing ---
[observability]
enabled = true

# Staging env: isolated staging stack (spec 0005 §3). `kv_namespaces` and
# `d1_databases` are not inherited by environments, so both are repeated here.
# Production's KV and D1 ids are distinct namespaces/databases — never shared.
# Deploy with `npm run deploy -- --env staging` (guard: scripts/deploy.mjs).
#
# Custom-domain route (BRAWUKA-236): takes effect on the next deploy once the
# `coffeemode.app` Cloudflare zone is active — the domain is not yet
# registered, so until then this worker stays reachable only via workers.dev.
# After the web app switches POI_SERVICE_URL to the custom domain and the
# cutover is verified, add `workers_dev = false` here to retire the
# workers.dev route.
[env.staging]
name = "poi-service-staging"

routes = [
  { pattern = "poi.staging.coffeemode.app", custom_domain = true },
]

[[env.staging.kv_namespaces]]
binding = "POI_KV"
id = "9f7f807aa68b47e3bbb6ecaf15c5f571"

[[env.staging.d1_databases]]
binding = "POI_DB"
database_name = "poi-store-staging"
database_id = "d069da6b-07e5-4fc0-b6a9-a685b3bef8b8"

# Production env: isolated production stack (spec 0005 §3).
# Deploy with `npm run deploy -- --env production` (guard: scripts/deploy.mjs).
#
# Custom-domain route (BRAWUKA-236): same zone precondition as staging —
# activates on the next deploy after the `coffeemode.app` zone exists. Add
# `workers_dev = false` only after the web app is verified on
# `poi.coffeemode.app`.
[env.production]
name = "poi-service-prod"

routes = [
  { pattern = "poi.coffeemode.app", custom_domain = true },
]

[[env.production.kv_namespaces]]
binding = "POI_KV"
id = "be0e4111b70f482ca23ed1f833142f88"

[[env.production.d1_databases]]
binding = "POI_DB"
database_name = "poi-store"
database_id = "7d01d154-03a7-4483-8b54-83f2c310af3b"