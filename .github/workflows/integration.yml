name: Integration

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "web/**"
      - ".github/workflows/application.yml"
      - ".github/workflows/integration.yml"
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "web/**"
      - ".github/workflows/application.yml"
      - ".github/workflows/integration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: coffeemode
          POSTGRES_PASSWORD: coffeemode
          POSTGRES_DB: coffeemode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeemode -d coffeemode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The current suite proves Postgres/PostGIS migrations, triggers, and DB
      # flows. MinIO remains a local-dev object-store stand-in, not this gate.
      - name: Real Postgres integration tests
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
        run: npm run test:integration
