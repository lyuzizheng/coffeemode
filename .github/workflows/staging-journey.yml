name: Staging Journey

# Post-merge staging verification (spec 0010 §5, spec 0003 §CI design).
# NEVER a PR gate: no `pull_request` trigger here, and branch protection
# requires only `ci-gate`. A staging outage must never block a merge.
# Serialization (spec 0010 §4: one journey run at a time) is owned HERE:
# `concurrency: staging-journey` + the runner's own mkdir lock in
# `scripts/devops/run-staging-journey.sh` (same group name in the log line).

on:
  push:
    branches:
      - main
  schedule:
    # 03:00 UTC nightly — clear of the 02:00 recompute window.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: staging-journey
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  journey:
    name: staging-journey
    runs-on: ubuntu-latest
    # Secrets live ONLY in the GitHub Environment `staging` (spec 0010 §5).
    # Nothing staging touches `NEXT_PUBLIC_*`; the runner maps secrets to
    # server-side env (`STAGING_DATABASE_URL`, `SUPABASE_*`) itself.
    environment: staging
    # No retries: a staging failure must fail loud (log + artifact), never
    # flake-green. The run never blocks a merge; triage from the uploaded log.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Cloudflare Access TCP tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "${CF_ACCESS_CLIENT_ID:-}" || -z "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            echo "Error: CF_ACCESS_CLIENT_ID or CF_ACCESS_CLIENT_SECRET secret is unset in Environment staging."
            exit 1
          fi
          CLOUDFLARED_VERSION="2026.9.1"
          CLOUDFLARED_SHA256="03f1f25d1cc93b9ad6c60569d44060bc4f17ed97075760ed8cfca4b12dcd68cc"
          if ! command -v cloudflared >/dev/null 2>&1; then
            echo "Installing cloudflared ${CLOUDFLARED_VERSION}..."
            curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /tmp/cloudflared
            echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
            sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
            rm -f /tmp/cloudflared
          fi
          echo "Starting Cloudflare Access TCP tunnel for ci-db.cafemood.app:5432..."
          cloudflared access tcp --hostname ci-db.cafemood.app --url 127.0.0.1:5432 \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" >/tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          READY=0
          for i in $(seq 1 30); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "Cloudflare Access TCP tunnel ready on 127.0.0.1:5432."
              READY=1
              break
            fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            echo "Error: Cloudflare Access TCP tunnel failed to become ready on 127.0.0.1:5432 within 30s."
            if [[ -f /tmp/cloudflared.log ]]; then
              echo "--- /tmp/cloudflared.log ---"
              cat /tmp/cloudflared.log
            fi
            exit 1
          fi

      - name: Staging user-journey suites (all)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash ../scripts/devops/run-staging-journey.sh --suite all

      - name: Stop Cloudflare Access TCP tunnel
        if: always()
        run: |
          if [[ -f /tmp/cloudflared.pid ]]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
            rm -f /tmp/cloudflared.pid
          fi

      - name: Failure notice
        if: failure()
        run: |
          {
            echo "## staging-journey FAILED"
            echo ""
            echo "Post-merge verification only — this never blocks a PR merge."
            echo "Triage from the job log; a tracking issue is opened manually"
            echo "so one flaky night cannot spam the tracker (spec 0010 §5)."
          } >> "$GITHUB_STEP_SUMMARY"
