name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.classify.outputs.application }}
      integration: ${{ steps.classify.outputs.integration }}
      image_service: ${{ steps.classify.outputs.image_service }}
      poi_service: ${{ steps.classify.outputs.poi_service }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            .agents/scripts/classify-ci-paths.sh --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              .agents/scripts/classify-ci-paths.sh >> "$GITHUB_OUTPUT"
          fi

      # Runs on every PR (unlike the docs-gate harness checks) so a new gated test
      # file or a new path family cannot ship with the wrong gate selection.
      - name: Verify path→gate classification
        run: .agents/scripts/check-ci-classification.sh

      # Likewise unconditional and dependency-free: `engines`, the TypeScript
      # version, and the Worker `compatibility_date` must agree across web/,
      # poi-service/, image-service/, CI, and the container images. A per-package
      # bump would otherwise only surface as a machine-specific difference.
      - name: Verify runtime pins (engines / TypeScript / Worker compatibility_date)
        run: .agents/scripts/check-runtime-pins.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan incremental changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            gitleaks detect --source . --verbose --redact
          else
            gitleaks detect --source . --log-opts="$BASE_SHA..$HEAD_SHA" --verbose --redact
          fi

  docs-gate:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: .agents/scripts/preflight.sh

      - name: Harness self-test
        run: .agents/scripts/harness-self-test.sh

  application-gate:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: coffeemode
          POSTGRES_PASSWORD: coffeemode
          POSTGRES_DB: coffeemode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeemode -d coffeemode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Structure guard (budgets, duplication, layer boundaries, exemption ratchet)
        run: npm run check:structure

      - name: Lint
        run: npm run lint

      - name: i18n key parity
        run: npm run check:i18n

      - name: Unit tests
        run: npm run test

      - name: Coverage ratchet (v8 thresholds in vitest.config.mts)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: web/coverage
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Verify bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Bundle analysis
        run: npm run analyze

      - name: Upload bundle analysis report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-report
          path: web/.next/diagnostics/analyze
          if-no-files-found: error

      - name: Verify PWA artifacts
        run: |
          test -f .next/server/app/serwist/sw.js.body
          test -f .next/server/app/manifest.webmanifest.body

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: E2E MVP smoke suite
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
          # Ephemeral CI database: the fail-closed seed guard (BRAWUKA-216) needs an explicit opt-in to seed it.
          ALLOW_SEED_DEV_DB: "1"
        run: npm run test:e2e

      - name: Lighthouse CI performance budgets
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
          # Ephemeral CI database: the fail-closed seed guard (BRAWUKA-216) needs an explicit opt-in to seed it.
          ALLOW_SEED_DEV_DB: "1"
        run: npm run lhci

      - name: Upload Lighthouse CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-report
          path: web/.lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  integration-gate:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: coffeemode
          POSTGRES_PASSWORD: coffeemode
          POSTGRES_DB: coffeemode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeemode -d coffeemode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start MinIO (for image round-trip)
        working-directory: .
        run: |
          docker compose up -d --wait minio
          docker compose run --rm minio-init

      - name: Install image-service dependencies (for image round-trip)
        working-directory: .
        run: npm ci --prefix image-service

      - name: Real Postgres integration tests
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
        run: npm run test:integration


      - name: Real Postgres user journey integration tests
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
        run: npm run test:integration:journey
      - name: Real Postgres HTTP lifecycle integration tests
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
        run: npm run test:integration:http
      - name: Real MinIO/R2 image round-trip tests
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
        run: npm run test:integration:images

      # The unit coverage step in `application-gate` runs with the real-DB specs
      # skipped, so it cannot see `lib/db/**` — the layer this job is about. This
      # ratchets that layer alone (BRAWUKA-173).
      - name: Real-DB coverage ratchet (lib/db)
        env:
          DATABASE_URL: postgres://coffeemode:coffeemode@localhost:5432/coffeemode
        run: npm run test:coverage:integration

      - name: Upload real-DB coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-report
          path: web/coverage-integration
          if-no-files-found: ignore

  image-service-gate:
    needs: changes
    if: needs.changes.outputs.image_service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: image-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deploy config guard (staging and production must resolve deployable)
        run: npm run deploy:check

  poi-service-gate:
    needs: changes
    if: needs.changes.outputs.poi_service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poi-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poi-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  ci-gate:
    needs:
      - changes
      - secret-scan
      - docs-gate
      - application-gate
      - integration-gate
      - image-service-gate
      - poi-service-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
