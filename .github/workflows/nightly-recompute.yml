name: Nightly work_stats recompute

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily — VPS local time is UTC
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    # DATABASE_URL is set from secrets at job level (secrets not allowed in jobs.<id>.if).
    # Missing secret explicitly fails the run to prevent green false-positive idle runs (BRAWUKA-393).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify DATABASE_URL is set
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::DATABASE_URL secret is not configured in repository secrets. Nightly recompute requires a valid database connection string to recompute work_stats and snapshot helpful rankings."
          exit 1

      - name: Run work_stats full recompute
        run: npm run recompute:work-stats

      - name: Snapshot Helpful ranking (DG148)
        run: npm run snapshot:helpful-ranking
