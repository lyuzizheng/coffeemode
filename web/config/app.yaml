# Product parameters (DG107). Specs name the parameter and its default; this
# file owns the live value. Changing a parameter is an edit here with a typed
# schema check at load, not a code change.
search:
  # Maximum allowed nearby-search radius — the product cap (spec 0001). The
  # POI worker's own bounding-box ceiling (200 km) lives in web/shared; this
  # proxy cap is deliberately stricter.
  maxRadiusKm: 10
cafes:
  # GET /api/cafes limit cap (also the default when no limit is given).
  listLimitMax: 50
feed:
  # Check-in feed page size for both Helpful and Newest modes (spec 0001).
  pageSize: 20
discovery:
  # Map-independent fallback center for the nearby-cafes query (DG112: no
  # geolocation prompt in discovery; the locate button is the
  # onboarding-geolocation slice's persistent control). Singapore until the
  # map-bound slices ship.
  defaultCenter:
    lat: 1.35
    lng: 103.8
seo:
  # CDN cache for the SSR /cafes/[id] shell (DG105/DG107): a viral shared
  # link must not hit Postgres per open. s-maxage is the shared-cache TTL;
  # stale-while-revalidate serves stale while revalidating in the background.
  shellCache:
    sMaxAgeSeconds: 600
    staleWhileRevalidateSeconds: 3600
  # 404 recovery block (DG111): how many nearby cafes to list relative to a
  # gone cafe's last known location. Radius reuses search.maxRadiusKm.
  recoveryLimit: 5
