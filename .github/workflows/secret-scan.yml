name: Secret Scan (full history + cron)

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-scan:
    name: gitleaks full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Full history scan
        run: |
          gitleaks git file://. --verbose --redact --report-format json --report-path /tmp/gitleaks-full.json
          echo "Full history scan complete. Findings written to /tmp/gitleaks-full.json"
          if [[ -s /tmp/gitleaks-full.json ]]; then
            echo "::warning::gitleaks found potential secrets in history — review /tmp/gitleaks-full.json"
          fi

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history
          path: /tmp/gitleaks-full.json
          if-no-files-found: ignore
