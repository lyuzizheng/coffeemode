name: Application

on:
  pull_request:
    paths:
      - coffeemode-frontend/**
      - .github/workflows/application.yml
  push:
    branches:
      - main
    paths:
      - coffeemode-frontend/**
      - .github/workflows/application.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: coffeemode-frontend

jobs:
  application-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: coffeemode-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck || npx tsc --noEmit

      - name: Lint
        run: pnpm run lint || true

      - name: Build
        run: pnpm run build
