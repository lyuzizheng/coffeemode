# All API rate limits (DG74). Scope is per-user when authenticated, per-IP
# otherwise. Code never hardcodes limits; tuning one is an edit here.
# windowMs: bucket window in milliseconds. maxRequests: tokens per window.
# Multi-window buckets (e.g. search) are a list; hitting ANY window fires 429
# and an alert (DG129).
cafes-read:
  windowMs: 60000
  maxRequests: 30
# Writes fuse cafe + first check-in + stats in one transaction, so check-ins,
# navigations, and cafe creation share this bucket.
cafes-write:
  windowMs: 60000
  maxRequests: 10
images:
  windowMs: 60000
  maxRequests: 10
places:
  windowMs: 60000
  maxRequests: 30
# Autocomplete fires per typing pause (client-debounced), so it needs a wider
# window than `places`. Google bills these at $0 while the session is open
# (BRAWUKA-602) — the cap bounds worker traffic, not spend.
places-autocomplete:
  windowMs: 60000
  maxRequests: 120
# Search is expensive (FTS + optional POI fanout) — multi-window per IP (DG129).
search:
  - windowMs: 60000
    maxRequests: 30
  - windowMs: 3600000
    maxRequests: 100
  - windowMs: 86400000
    maxRequests: 200
profile-read:
  windowMs: 60000
  maxRequests: 30
profile-write:
  windowMs: 60000
  maxRequests: 10
# Full-account data export — a whole-table read per call; tighter than
# profile-read so scraping can't ride the read bucket.
profile-export:
  windowMs: 60000
  maxRequests: 5
identity-write:
  windowMs: 60000
  maxRequests: 10

# First-visit locate: resolves a granted geolocation to a city and persists
# it for signed-in users (DG121). Anonymous callers hit it once per grant.
onboarding:
  windowMs: 60000
  maxRequests: 10

# Keepalive + runtime-config reads (BRAWUKA-284): public, unauthenticated, and
# hit by the smoke test + every page view. Sized like cafes-read;
# abuse is bounded by the edge 300/min flood rule (BRAWUKA-237), not this bucket.
heartbeat:
  windowMs: 60000
  maxRequests: 30
runtime-config:
  windowMs: 60000
  maxRequests: 30

# Liveness probe (BRAWUKA-639): public by design — Traefik LB checks (12/min),
# Docker healthchecks (12/min), and deploy convergence polls (~20/min burst)
# carry no credentials, so auth would break them. Sized at 120/min so the
# shared `anon:unknown` bucket (internal probes without cf-connecting-ip) never
# trips on infra traffic alone (worst case ≈44/min); per-IP flood is still
# bounded and every denial emits a `rate_limited` line for the Grafana flood
# alert. Coarse backstop remains the edge 300/min rule (BRAWUKA-237).
health:
  windowMs: 60000
  maxRequests: 120
