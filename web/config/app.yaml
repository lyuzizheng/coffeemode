# Product parameters (DG107). Specs name the parameter and its default; this
# file owns the live value. Changing a parameter is an edit here with a typed
# schema check at load, not a code change.
search:
  # Maximum allowed nearby-search radius — the product cap (spec 0001). The
  # POI worker's own bounding-box ceiling (200 km) lives in web/shared; this
  # proxy cap is deliberately stricter.
  maxRadiusKm: 10
  # Suggestion rows cap per DG46 (top-10 only, no pagination).
  defaultSuggestionLimit: 10
  maxSuggestionLimit: 10
  # Weak local results threshold per DG49 (< 3 matches).
  weakResultsThreshold: 3
  # Server-side DB fetch cap to bound in-memory filtering.
  dbFetchCap: 100
  # Maximum iterative fetch batches when evaluating unpushed in-memory filters.
  maxIterativeFetchBatches: 10
  # Minimum query length to trigger remote POI search proxy
  minPoiQueryLength: 3
  # Relevance ranking score weights for text search
  relevanceWeights:
    exactNameMatch: 100
    prefixMatch: 80
    fuzzyMatch: 50
    secondaryMatch: 10
  # Conditional low-relevance truncation per DG131 (only when q non-empty & at least one >=50).
  minRelevanceScore: 50
  # External source toggles per DG134 (Apple gated until MapKit ready).
  externalSources:
    google: true
    apple: false
  # Default ranking mode per DG136 (relevance vs good_first). Client overrides via ?ranking=.
  rankingMode: relevance
  # DG136 good_first ranking: cafes at/above these work-profile scores get
  # `boost` added to their relevance before sorting (BRAWUKA-250).
  goodFirst:
    experienceMin: 80
    compositeMin: 75
    boost: 10
  # Private Cache-Control for GET /api/search success responses (DG137-B).
  responseCache:
    maxAgeSeconds: 10
    staleWhileRevalidateSeconds: 30
  # Client search-as-you-type knobs (DG44/DG47). Owned here, delivered to the
  # browser via NEXT_PUBLIC_SEARCH_* env (next.config.ts) — the client bundle
  # cannot read this file. Distinct from minPoiQueryLength above (server POI
  # trigger); do not merge them (BRAWUKA-250).
  client:
    minQueryLength: 3
    debounceMs: 400
stats:
  # Work-profile composite score weights (DG107)
  dimWeights:
    wifi: 0.3
    outlets: 0.2
    seats: 0.2
    temp: 0.15
    coffee: 0.15
  # Recency decay factor for repeat visitor contributions
  recencyDecay: 0.6
cafes:
  # GET /api/cafes limit cap (also the default when no limit is given).
  listLimitMax: 50
feed:
  # Check-in feed page size for both Helpful and Newest modes (spec 0001).
  pageSize: 20
discovery:
  # Map-independent fallback center for the nearby-cafes query (DG112: no
  # geolocation prompt in discovery; the locate button is the
  # onboarding-geolocation slice's persistent control). Singapore until the
  # map-bound slices ship.
  defaultCenter:
    lat: 1.35
    lng: 103.8
seo:
  # CDN cache for the SSR /cafes/[id] shell (DG105/DG107): a viral shared
  # link must not hit Postgres per open. s-maxage is the shared-cache TTL;
  # stale-while-revalidate serves stale while revalidating in the background.
  # The static `Cache-Control: public, …` header only describes the cacheable
  # case. The bypass fields below are the executable side of that header
  # (BRAWUKA-184): the proxy enforces them per response (see
  # lib/cache-policy.ts) and the edge cache rule MUST enforce them before
  # the CDN lands (see deploy/dokploy/cache-rules.json, generated from these
  # values). Without them a session cookie or a 404 would be served
  # cross-user from shared cache.
  shellCache:
    sMaxAgeSeconds: 600
    staleWhileRevalidateSeconds: 3600
    # Only these statuses may sit in shared cache. Every other status — the
    # proxy-rewritten gone-cafe 404, 500s, redirects — MUST bypass.
    cacheableStatuses: [200]
    # A response carrying Set-Cookie (Supabase session refresh via the proxy)
    # MUST bypass, otherwise a refreshed session cookie is cached cross-user.
    bypassOnSetCookieResponse: true
    # Request-cookie name prefixes that force an edge bypass (Supabase
    # session cookies). The origin cannot see the edge cache key, so this is
    # a CDN-rule condition, not an origin header.
    bypassOnRequestCookiePrefixes: ["sb-"]
    # The shell is content-negotiated (cookie/Accept-Language, DG110), but
    # Next overwrites Vary on App Router HTML with its internal
    # `rsc, next-router-*` set, so origin-declared Vary never ships. The edge
    # MUST key on these headers instead. `sharedCacheAcrossLocales: false`
    # states explicitly that locales MUST NOT share a cache entry — without
    # it the first locale to hit a URL would be served to everyone.
    varyHeaders: ["Accept-Language"]
    sharedCacheAcrossLocales: false
  # 404 recovery block (DG111): how many nearby cafes to list relative to a
  # gone cafe's last known location. Radius reuses search.maxRadiusKm.
  recoveryLimit: 5
checkins:
  # Product caps for check-in content (DG67/DG68, #200): kept in config so a
  # product decision to change them is a typed YAML edit, not a code change.
  photoCap: 6
  noteMaxChars: 500
  # How long the sign-in gate's pending draft (DG66) survives in IndexedDB.
  # Sized for an interrupted OAuth bounce, not for long-term storage.
  pendingDraftTtlHours: 72
  # Same-day revisit window (DG64): at most 1 check-in per cafe per user per
  # this many hours — a further visit edits the existing check-in. Read by
  # the createCheckIn windowed existence check and exposed to the drawer via
  # GET /api/checkins/last so client and server never hardcode it.
  revisitWindowHours: 24
profile:
  # Profile page primary lists limit cap and default page size (DG107)
  listLimitMax: 50
  listPageSize: 20
  # Max character length for inline display name editing
  displayNameMaxChars: 24
  # Max client-side recent searches items stored
  recentSearchesMax: 20
  # Public handle rules (spec 0006 Q11, BRAWUKA-250). The handle regex bounds
  # derive from minChars/maxChars in lib/db/identity.ts — edit here, not there.
  handle:
    minChars: 3
    maxChars: 30
    # Cooldown between user-chosen handle edits.
    changeCooldownDays: 7
    # Truncation cap for the display-name slug base.
    slugMaxChars: 25
    # Collision retries for `slug-xxxx` generation.
    generateMaxAttempts: 10
images:
  # Server output cap and client canvas downscale target (single product cap,
  # BRAWUKA-250). The client reads it via NEXT_PUBLIC_IMAGE_MAX_DIMENSION.
  maxOriginalDimension: 4096
  # WebP encode quality for card/thumbnail variants.
  webpQuality: 80
  # R2 fetch guards for the image processor.
  r2DownloadTimeoutMs: 30000
  r2UploadTimeoutMs: 30000
  # Headroom over the web/shared upload cap before the processor aborts a
  # download (rounding tolerance, still bounds memory per request).
  downloadSlackBytes: 524288 # 512 KiB
query:
  # TanStack Query defaults, owned here and delivered to the browser via
  # NEXT_PUBLIC_QUERY_* env (next.config.ts) — the client bundle cannot read
  # this file (BRAWUKA-250).
  staleTimeMs: 300000 # 5 minutes
  gcTimeMs: 86400000 # 24 hours
  persistMaxAgeMs: 604800000 # 7 days IndexedDB retention
validation:
  # Server field-length caps (BRAWUKA-250).
  cafeAddressMaxChars: 300
  profileCityMaxChars: 50
budgets:
  # Bundle size budgets (uncompressed bytes, checked against .next/static)
  # Rationale: Bounds single chunk weight and total client static payload to ensure fast initial page delivery and low memory footprint on mobile.
  # Expiry: Review when map-bound client SDKs (MapKit JS) or heavy chart modules land.
  bundle:
    maxJsChunkBytes: 409600 # 400 KB
    maxCssChunkBytes: 512000 # 500 KB
    maxTotalStaticBytes: 5242880 # 5 MB
  # Lighthouse audit score thresholds (0.0 to 1.0)
  # Rationale: Spec 0001:1182 mandates cafe detail performance >= 80 (0.80). Category thresholds
  # at 85 (0.85) ensure a consistent quality floor across accessibility, best-practices, and SEO.
  # Expiry: Review when live client-side map rendering replaces SSR placeholder shell.
  lighthouse:
    performance: 0.8
    accessibility: 0.85
    bestPractices: 0.85
    seo: 0.85


