name = "image-service"
main = "src/index.ts"
# Pinned deliberately: this date is a runtime contract, so it moves only in a
# reviewed commit — never implicitly, and never "today". 2025-08-01 is the newest
# date whose default-on flag set (Cloudflare "compatibility flags" history) was
# reviewed against this Worker, and it stays well below the workerd build pinned
# in package-lock.json.
#
# The bump from 2024-01-01 is exactly what `nodejs_compat` below needed: v2 mode
# applies from compatibility date 2024-09-23 onward, i.e. real Node built-ins plus
# Wrangler's unenv polyfills instead of v1's import-only shims. Measured `typeof`
# on the pinned workerd: Buffer undefined -> function, process undefined -> object
# (process.versions.node "22.14.0"), process.env undefined -> object. That is what
# the flag protects — any npm dependency that reaches for `node:*` / Buffer /
# process. This Worker's own source uses only Web Crypto (aws4fetch) and
# crypto.randomUUID(), so the exposure is transitive, not direct.
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Local kit defaults (S2): so `docker compose up -d --wait` works without editing.
# These values are for local dev only (host `wrangler dev` + the compose MinIO
# service); they MUST NOT reach a deployed Worker — minio/localhost endpoints
# break every presigned upload and HEAD check in production.
#
# Deploy through the guarded entrypoint: `npm run deploy -- --env production`.
# scripts/deploy.mjs refuses any resolved config (including the top-level vars
# below, and `--env` names that are not declared here) that still points at local
# dev, so a forgetful bare `wrangler deploy` cannot ship these values.
R2_ACCOUNT_ID = "local"
R2_BUCKET_NAME = "coffeemode"
R2_PUBLIC_URL = "http://localhost:9000/coffeemode"
# Local kit (S2): point presign + HEAD at MinIO instead of real R2.
# Inside compose the worker reaches MinIO as http://minio:9000; on the host
# (manual `wrangler dev`) use http://localhost:9000. Compose service sets
# R2_ENDPOINT=http://minio:9000 via environment — this var is the host fallback.
R2_ENDPOINT = "http://localhost:9000"
# TTL (seconds) for presigned upload/download URLs. Optional: when unset or
# invalid, src/constants.ts DEFAULT_UPLOAD_URL_TTL_SECONDS (600) applies.
# WARNING: must stay well under the 1h upload-intent window
# (web/lib/db/image-uploads.ts, issue #33) or completes of old uploads 404
# despite a still-valid URL.
UPLOAD_URL_TTL_SECONDS = "600"

[[r2_buckets]]
binding = "R2_BUCKET"
# Must match R2_BUCKET_NAME above (local: coffeemode).
bucket_name = "coffeemode"

# Production env: full override of the local-dev [vars] above — `vars` and
# `r2_buckets` are not inherited by environments, so every value is repeated.
# `R2_ENDPOINT = ""` is deliberate: production signs against the real R2
# endpoint derived from R2_ACCOUNT_ID, and the empty value keeps wrangler from
# warning that the top-level localhost endpoint is missing here.
# Deploy with `npm run deploy -- --env production` (guard: scripts/deploy.mjs).
[env.production]
name = "image-service-prod"
vars = { R2_ACCOUNT_ID = "bf69da5249b63731ad79545d0095e8db", R2_BUCKET_NAME = "coffeemode-images-prod", R2_PUBLIC_URL = "https://images.coffeemode.app", R2_ENDPOINT = "", UPLOAD_URL_TTL_SECONDS = "600" }
[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "coffeemode-images-prod"

# Staging env: isolated staging stack (same override rules as production).
# Deploy with `npm run deploy -- --env staging` (guard: scripts/deploy.mjs).
[env.staging]
name = "image-service-staging"
vars = { R2_ACCOUNT_ID = "bf69da5249b63731ad79545d0095e8db", R2_BUCKET_NAME = "coffeemode-images-staging", R2_PUBLIC_URL = "https://staging-images.coffeemode.app", R2_ENDPOINT = "", UPLOAD_URL_TTL_SECONDS = "600" }
[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "coffeemode-images-staging"
# Lifecycle: configure an R2 lifecycle rule (Cloudflare dashboard or S3 API)
# to delete abandoned `original/` objects. Because R2 lifecycle rules cannot
# inspect custom metadata, the recommended flow is:
#   1. A scheduled cleanup Worker/script lists `original/` objects.
#   2. Objects whose `x-amz-meta-targettype` metadata is missing and that are
#      older than 7 days are deleted.
#   3. Processed `card/` and `thumbnail/` objects are tied to DB records and
#      should be deleted by the application when the parent cafe/checkin is
#      removed.
# See image-service/src/constants.ts for the 10 MB upload cap.

# Secrets (set via `wrangler secret put` for prod, or `image-service/.dev.vars` for local dev — never commit):
#   IMAGE_SERVICE_TOKEN
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
