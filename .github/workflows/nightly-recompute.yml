name: Nightly work_stats recompute

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily — VPS local time is UTC
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    # DATABASE_URL is set from secrets at job level (secrets not allowed in jobs.<id>.if).
    # Steps gate on env.DATABASE_URL so scheduled runs without the secret skip green
    # with a notice, while a real recompute failure still fails the run.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skip notice when DATABASE_URL is not set
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL not set — skipping recompute (expected outside production)"

      - name: Run work_stats full recompute
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run recompute:work-stats
