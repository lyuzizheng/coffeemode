name: POI Service

on:
  pull_request:
    paths:
      - poi-service/**
      - .github/workflows/poi-service.yml
  push:
    branches:
      - main
    paths:
      - poi-service/**
      - .github/workflows/poi-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: poi-service

jobs:
  poi-service-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poi-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Deploy (wrangler deploy) runs manually until the Cloudflare account,
  # D1 + KV namespaces, and secrets exist — see docs/agent/pending-user-actions.md §6.