# CoffeeMode POI cache service — Cloudflare Worker
# Docs: docs/specs/0001-nextjs-migration.md § "POI cache service"

name = "poi-service"
main = "src/index.ts"
compatibility_date = "2024-01-01" # Use a date in the past; update when intentionally adopting newer runtime behaviour.

# --- Secrets (never committed) ---
#   POI_SERVICE_TOKEN       shared secret for service-to-service auth
#   GOOGLE_PLACES_API_KEY   Google Places API (New) key
# Set them with:  wrangler secret put <NAME>
# Local dev: put them in .dev.vars (gitignored)

# --- Bindings ---
# 1. Create the resources:
#      wrangler d1 create poi-store
#      wrangler kv namespace create poi-cache
# 2. Copy the returned ids into the placeholders below.
# 3. Apply the D1 schema:
#      wrangler d1 migrations apply poi-store --remote
# 4. Set secrets (never commit these):
#      wrangler secret put POI_SERVICE_TOKEN
#      wrangler secret put GOOGLE_PLACES_API_KEY

[[kv_namespaces]]
binding = "POI_KV"
# Local compose (S2): deterministic local ID so `wrangler dev --local` / miniflare-poi
# never rejects the placeholder. Production: replace with the real id from
# `wrangler kv namespace create poi-cache`.
id = "22222222-2222-2222-2222-222222222222"

[[d1_databases]]
binding = "POI_DB"
database_name = "poi-store"
# Local compose (S2): deterministic local ID for `wrangler d1 migrations apply --local`
# and miniflare-poi. Production: replace with the real id from `wrangler d1 create poi-store`.
database_id = "11111111-1111-1111-1111-111111111111"

# --- Routing ---
[observability]
enabled = true