name: Image Service

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - image-service/**
      - .github/workflows/image-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: image-service

jobs:
  image-service-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: image-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Deploy (wrangler deploy) runs manually until the Cloudflare account,
  # R2 bucket, S3 API token, and IMAGE_SERVICE_TOKEN secret exist —
  # see docs/agent/pending-user-actions.md §6.
