# CafeMood Production Stack — Dokploy Docker Compose
# Architecture: docs/specs/0005-dokploy-vps-and-deployment-architecture.md
#
# Production Stack (BRAWUKA-241; decision 34a / BRAWUKA-240 D1):
#   - web-prod: Next.js standalone container on internal port 3000
#   - Database: Supabase prod project (Postgres + PostGIS, region ap-southeast-1)
#     reached over DATABASE_URL (pooled, sslmode=require). No self-hosted
#     postgres service exists in this stack.
#   - Ingress: Web container connects to external traefik-net for Traefik routing
#   - Isolation: Staging uses its own Supabase project; stacks share nothing
# Deployment Mode & Zero-Downtime Guarantee:
#   - Docker Swarm Stack Mode (RECOMMENDED for zero-downtime): With Swarm enabled
#     on the VPS (`docker swarm init`), Dokploy deploys via `docker stack deploy`,
#     honoring `deploy.update_config` with `order: start-first`.
#   - Dokploy Application Mode: Dokploy builds and swaps containers using health checks.
#   - Plain Docker Compose Mode: `docker compose up -d` recreates the container;
#     Traefik shifts traffic once the healthcheck passes.
#
# Manual Execution:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Note on Compose Variable Interpolation:
#   Expressions like ${DATABASE_URL:?...} interpolate from the shell environment
#   and project environment, not the service `env_file`. When running manually
#   outside Dokploy, pass `--env-file .env.prod` so Docker Compose resolves
#   interpolations before starting containers.
#
# Scheduled Jobs & Nightly Recompute (BRAWUKA-475 / BRAWUKA-476):
#   The nightly work_stats recompute and Helpful ranking snapshot run daily
#   at 02:00 UTC directly against web-prod via Dokploy scheduled jobs or host crontab,
#   reusing the container's DATABASE_URL (zero credential leakage to GitHub secrets):
#   - Option A (Dokploy Scheduled Job on web-prod, recommended):
#       Schedule: 0 2 * * *
#       Command: [ -f /app/.env ] && set -a && . /app/.env && set +a; if [ -d web ]; then cd web; fi; if ! (npm run recompute:work-stats && npm run snapshot:helpful-ranking); then if [ -n "$MULTICA_AUTOPILOT_WEBHOOK_URL" ]; then node -e 'const url=process.env.MULTICA_AUTOPILOT_WEBHOOK_URL; if(url){await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({job:"nightly-recompute",error:"Nightly recompute execution failed in container",run:"dokploy:schedule:nightly-recompute"}),signal:AbortSignal.timeout(10000)}).catch(()=>{});}'; fi; exit 1; fi
#   - Option B (VPS host crontab):
#       0 2 * * * /path/to/coffeemode/deploy/dokploy/nightly-recompute.sh >> /var/log/nightly-recompute.log 2>&1
#   Failure alerting is wired to Multica autopilot webhook (MULTICA_AUTOPILOT_WEBHOOK_URL).
services:
  web-prod:
    image: coffeemode-web-prod:${IMAGE_TAG:-latest}
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${IMAGE_TAG:-latest}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL:?NEXT_PUBLIC_R2_PUBLIC_URL must be set in shell environment, via docker compose --env-file .env.prod, or Dokploy environment}
        APP_ENV: ${APP_ENV:?APP_ENV must be set in shell environment, via docker compose --env-file .env.prod, or Dokploy environment}
    container_name: coffeemode-web-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in shell environment, via docker compose --env-file .env.prod, or Dokploy environment}
      # OpenTelemetry → Grafana Cloud Tempo (BRAWUKA-606). Non-secret, so it is
      # pinned here instead of left to a Dokploy env paste. The credential
      # (`OTEL_EXPORTER_OTLP_HEADERS`) stays in .env.prod.
      # `deployment.environment` matches APP_ENV — the repo's environment
      # discriminator — and is the attribute Grafana Application Observability
      # filters on.
      # No sampler on purpose (BRAWUKA-605 §6 decision 3, superseded 2026-09-21). Head sampling drops
      # whole traces at the root span, and `traces_spanmetrics_*` is derived
      # from the spans that actually arrive — so a 0.1 ratio would make every
      # RED count a tenth of reality and quietly break the alerting that reads
      # them. Volume is orders of magnitude below the 50 GB free tier, so 100%
      # is both correct and cheap. If volume ever grows, the fix is tail
      # sampling (keep all errors + slow traces), not a head ratio.
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp-gateway-prod-ap-southeast-1.grafana.net/otlp
      OTEL_RESOURCE_ATTRIBUTES: service.name=coffeemode-web,deployment.environment=production
    networks:
      - coffeemode-prod-network
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Apex & WWW Routing
      - "traefik.http.routers.coffeemode-prod.rule=Host(`${PROD_DOMAIN:-cafemood.app}`) || Host(`www.${PROD_DOMAIN:-cafemood.app}`)"
      - "traefik.http.routers.coffeemode-prod.entrypoints=websecure"
      - "traefik.http.routers.coffeemode-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.coffeemode-prod.service=coffeemode-prod-svc"
      # Middlewares: WWW redirect to apex + HSTS/Security headers (no-op sslRedirect removed)
      - "traefik.http.routers.coffeemode-prod.middlewares=prod-www-redirect@docker,prod-sec-headers@docker"
      - "traefik.http.middlewares.prod-www-redirect.redirectregex.regex=^https://www\\.${PROD_DOMAIN:-cafemood.app}/(.*)"
      - "traefik.http.middlewares.prod-www-redirect.redirectregex.replacement=https://${PROD_DOMAIN:-cafemood.app}/$${1}"
      - "traefik.http.middlewares.prod-www-redirect.redirectregex.permanent=true"
      - "traefik.http.middlewares.prod-sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.prod-sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.prod-sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.prod-sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.prod-sec-headers.headers.stsPreload=true"
      # Service & Healthcheck for Zero-Downtime Rolling Swap
      - "traefik.http.services.coffeemode-prod-svc.loadbalancer.server.port=3000"
      - "traefik.http.services.coffeemode-prod-svc.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.coffeemode-prod-svc.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.coffeemode-prod-svc.loadbalancer.healthcheck.timeout=3s"
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
        monitor: 15s
        max_failure_ratio: 0
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "1.00"
          memory: 1024M
  cloudflared-prod:
    image: cloudflare/cloudflared:2026.9.1
    container_name: coffeemode-cloudflared-prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN_PROD:?CLOUDFLARED_TUNNEL_TOKEN_PROD must be set in Dokploy environment}
    networks:
      - coffeemode-prod-network
      - traefik-net
    depends_on:
      web-prod:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

networks:
  coffeemode-prod-network:
    name: coffeemode-prod-network
    driver: bridge
  traefik-net:
    external: true

